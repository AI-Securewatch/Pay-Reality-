# Render Blueprint for the PayReality backend, zero-additional-cost pilot
# topology: one free web service only. OPA runs embedded in the same
# container (see server/entrypoint.sh, server/Dockerfile), bound to
# loopback only, instead of a separate private service, since Render's
# private services have no free tier and this deployment is explicitly
# scoped to demonstrations and enterprise pilot conversations at zero
# added infrastructure cost, not the higher-isolation topology described
# in DEPLOYMENT.md's Series A section.
#
# This file has not been applied against a real Render account as a
# Blueprint import (the actual deploy in this pass was done directly
# against Render's REST API, service by service, since Blueprint import
# requires the Render GitHub App to already have repository access). Apply
# it with: Render Dashboard -> New -> Blueprint -> connect this repo ->
# Apply, if you want Render to manage this from render.yaml going forward.
#
# Reuses an existing free Postgres instance (payreality-db) rather than
# declaring one here, since a `databases:` block would make Render try to
# create a *new* database on Blueprint apply rather than adopt the
# existing one. Get its internal connection string from the Render
# dashboard (payreality-db -> Connect -> Internal Connection String) and
# paste it into DATABASE_URL below, prefixing the scheme with
# "postgresql+psycopg://" instead of "postgresql://" for SQLAlchemy.

services:
  - type: web
    name: payreality-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Existing free-tier payreality-db's internal connection string,
      # scheme changed to postgresql+psycopg://. Expires ~30 days after
      # creation (Render free Postgres); re-provision and update this
      # before it lapses, or upgrade it to a paid plan once billing is
      # set up (see GO_LIVE.md).
      - key: DATABASE_URL
        sync: false
      # No OPA_URL entry: app/config.py already defaults to
      # http://localhost:8181, which is correct now that OPA runs
      # embedded in this same container.
      - key: EVIDENCE_SIGNING_KEY_B64
        sync: false
      - key: EVIDENCE_SIGNING_KEY_ID
        value: signing_key_prod_v1
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INTENT_SIGNATURE_WINDOW_SECONDS
        value: "300"
      - key: CORS_ORIGIN
        value: https://payreality.aisecurewatch.com
